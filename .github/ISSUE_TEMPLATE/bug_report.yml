name: Bug report
description: Something does not work as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste or attach anything from your real Apple Health export**:
        no `export.xml` snippets with your values, ECG CSVs, GPX routes, Parquet/DuckDB files, app
        screenshots or ML reports from your own data. Reproduce with the synthetic data (`make demo`) where
        you can, and describe what differs in your export (iOS version, language, devices, metric names).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach personal health data (exports, ECG/GPX files, Parquet/DuckDB files, screenshots or logs with my values, names or locations).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Ideally with the synthetic sample data (`make sample`, `make demo`).
      placeholder: |
        1. make sample
        2. make pipeline EXPORT_DIR=sample_data/apple_health_export DATA_DIR=sample_data/data
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The traceback or log. Remove values, device names and paths that identify you.
      render: shell
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Bronze parser (export.xml, ECG, GPX, clinical records)
        - Silver / gold SQL
        - Data quality checks
        - Streamlit app
        - Lakeview dashboard
        - Databricks bundle / notebooks / app
        - ML experiments
        - Sample data generator
        - Docs / tooling
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where does it run?
      options:
        - Local (DuckDB)
        - Databricks (serverless)
        - Databricks (classic cluster)
        - Both
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4 (Apple Silicon) / Ubuntu 24.04 / Windows 11 + WSL
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.13 (output of .venv/bin/python --version)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version or commit
      placeholder: 0.1.0 / main@abc1234
  - type: input
    id: ios
    attributes:
      label: iOS version and export language
      description: The iPhone language changes date formats and ECG headers in the export.
      placeholder: iOS 18.3, German
  - type: input
    id: databricks
    attributes:
      label: Databricks details (if relevant)
      description: CLI version, runtime or serverless environment version, cloud. No workspace URLs.
      placeholder: CLI v0.250.0, serverless env 3, AWS
