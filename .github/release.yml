# Categories for auto-generated GitHub release notes. CHANGELOG.md stays the human-written record.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "🚨 Breaking changes"
      labels: [breaking-change]
    - title: "✨ New features"
      labels: [enhancement, feature]
    - title: "🐛 Bug fixes"
      labels: [bug, fix]
    - title: "📖 Documentation"
      labels: [documentation]
    - title: "🔧 Maintenance"
      labels: [dependencies, ci, refactor]
    - title: "Other changes"
      labels: ["*"]
